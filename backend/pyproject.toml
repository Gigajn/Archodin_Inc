[project]
name = "aahc-backend"
version = "0.1.0"
description = "Autonomous AI Holding Company - Phase 1 backend foundation"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
