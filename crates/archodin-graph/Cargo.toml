[package]
name = "archodin-graph"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "Archodin Graph orchestration (placeholder)"

[dependencies]
langchain-rust = { path = "../.." }
futures = "0.3.31"
tokio = { version = "1", features = ["time", "rt", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
thiserror = "2.0.17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
zeroize = "1.9.1"
