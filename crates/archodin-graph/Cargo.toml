[package]
name = "archodin-graph"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Archodin Graph orchestration (placeholder)"

[dependencies]
langchain-rust = { path = "../.." }
futures = "0.3.31"
tokio = { version = "1", features = ["time", "rt", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "stream"] }
# reqwest 0.12 ONLY for Ollama (B3): ollama-rs 0.3.6 is built on reqwest
# 0.12, so the guarded 0.13 client cannot be injected (ADR 0025 §3) and
# the timeout must be set on a 0.12 client built here. Same features
# ollama-rs itself enables (json + stream); loopback-only, no TLS needed.
reqwest012 = { package = "reqwest", version = "0.12", default-features = false, features = ["json", "stream"] }
# SSRF filtering at resolve time (ADR 0010): http-acl supplies the ACL and
# the filtering DNS resolver wired into `http_guard::shared_client()`.
# Both crates declare reqwest with default-features = false and no TLS
# feature, so they add no second TLS stack.
http-acl = "0.14.0"
http-acl-reqwest = "0.14.0"
# The official MCP SDK, replacing the hand-rolled JSON-RPC client in mcp.rs
# (ADR 0009). Minimal features: `client` + Streamable HTTP over the shared
# reqwest client + stdio child processes. `reqwest-native-tls` — not the
# default rustls — so there is still only one TLS stack in the workspace.
# No `auth` (no OAuth) and no `elicitation`.
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process", "reqwest-native-tls"] }
octocrab = { version = "=0.54.9", default-features = false, features = ["reqwest"] }
thiserror = "2.0.17"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
zeroize = "1.9.1"
async-trait = "0.1"
async-stream = "0.3"
base64 = "0.22"

[features]
# Native Providers that langchain-rust gates behind its own features.
ollama = ["langchain-rust/ollama"]
bedrock = ["langchain-rust/bedrock"]

[dev-dependencies]
# Same version as crates/archodin: the unit tests below fake servers with it.
mockito = "1.7"
